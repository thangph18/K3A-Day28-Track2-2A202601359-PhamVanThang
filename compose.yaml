name: lab28-platform

x-lab-environment: &lab-environment
  LAB28_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  LAB28_QDRANT_URL: http://qdrant:6333
  LAB28_FEAST_SERVER_URL: http://feast:6566
  LAB28_FEAST_METRICS_URL: http://feast:8000
  MLFLOW_TRACKING_URI: http://mlflow:5000
  LAB28_PUSHGATEWAY_URL: http://pushgateway:9091
  LAB28_SPARK_REMOTE: sc://spark-connect:15002
  # Spark Connect resolves table paths on the server, not in the Python client.
  # Every Compose service mounts the repository at /workspace on all host OSes,
  # so this container path is stable on Windows, macOS and Linux.
  LAB28_DELTA_ROOT: /workspace/.lab28/delta
  FASTEMBED_CACHE_PATH: /workspace/.lab28/fastembed
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  LAB28_OTEL_ENABLED: "true"

services:
  runtime-init:
    image: alpine:3.22.1
    command:
      - /bin/sh
      - -ec
      - >-
        mkdir -p /runtime/delta /runtime/feast /runtime/fastembed /runtime/mlflow
        /runtime/airflow && chmod -R a+rwX /runtime
    volumes:
      - ./.lab28:/runtime
    restart: "no"

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "${LAB28_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:19092"]
    depends_on:
      kafka:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "${LAB28_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 30

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.2
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
    ports:
      - "${LAB28_MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 40

  feast:
    build:
      context: .
      dockerfile: docker/feast/Dockerfile
    working_dir: /workspace/feature-repo
    command:
      - /bin/sh
      - -ec
      - >-
        python /workspace/scripts/create_feature_snapshot.py
        /workspace/.lab28/delta/exports/asker_activity &&
        feast apply &&
        exec feast serve --host 0.0.0.0 --port 6566 --metrics
    environment:
      <<: *lab-environment
    ports:
      - "${LAB28_FEAST_PORT:-6566}:6566"
      - "${LAB28_FEAST_METRICS_PORT:-6570}:8000"
    volumes:
      - .:/workspace:ro
      - ./.lab28:/workspace/.lab28
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6566/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s

  spark-connect:
    image: apache/spark:4.2.0-scala2.13-java17-python3-ubuntu
    profiles: ["full"]
    user: "0:0"
    working_dir: /workspace
    command:
      - /opt/spark/sbin/start-connect-server.sh
      - --wait
      - --packages
      - io.delta:delta-connect-server_4.2_2.13:4.4.0
      - --conf
      - spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      - --conf
      - spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      - --conf
      - spark.sql.session.timeZone=UTC
      - --conf
      - spark.driver.memory=1g
    ports:
      - "${LAB28_SPARK_PORT:-15002}:15002"
      - "${LAB28_SPARK_UI_PORT:-4040}:4040"
    volumes:
      - .:/workspace:ro
      - ./.lab28:/workspace/.lab28
      - spark-ivy:/root/.ivy2
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/15002'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    profiles: ["full"]
    working_dir: /workspace
    entrypoint: ["/usr/bin/dumb-init", "--", "/bin/sh", "-ec"]
    command:
      - >-
        python /workspace/scripts/prepare_airflow_auth.py
        /workspace/.lab28/airflow/simple-auth-passwords.json &&
        exec airflow standalone
    environment:
      <<: *lab-environment
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /workspace/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /workspace/.lab28/airflow/simple-auth-passwords.json
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
      AIRFLOW__API__BASE_URL: http://airflow:8080
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://127.0.0.1:8080/execution/
      OTEL_SERVICE_NAME: lab28-airflow
    ports:
      - "${LAB28_AIRFLOW_PORT:-8082}:8080"
    volumes:
      - .:/workspace:ro
      - ./.lab28:/workspace/.lab28
      - airflow-data:/opt/airflow
    depends_on:
      kafka:
        condition: service_healthy
      spark-connect:
        condition: service_healthy
      feast:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      <<: *lab-environment
      LAB28_VLLM_BASE_URL: ${LAB28_VLLM_BASE_URL:-http://host.docker.internal:8001/v1}
      LAB28_VLLM_MODEL_ID: ${LAB28_VLLM_MODEL_ID:-Qwen/Qwen3-1.7B}
      LAB28_VLLM_REQUIRE_REAL: ${LAB28_VLLM_REQUIRE_REAL:-false}
      OTEL_SERVICE_NAME: lab28-api
      PYTHONPATH: /workspace/src
    ports:
      - "${LAB28_API_PORT:-8000}:8000"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - .:/workspace:ro
      - ./.lab28:/workspace/.lab28
    depends_on:
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      feast:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 40

  gateway:
    image: envoyproxy/envoy:v1.39.1
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--service-node", "lab28-gateway"]
    ports:
      - "${LAB28_GATEWAY_PORT:-8080}:8080"
      - "${LAB28_GATEWAY_ADMIN_PORT:-9901}:9901"
    volumes:
      - ./gateway/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      api:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${LAB28_JAEGER_PORT:-16686}:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${LAB28_OTLP_GRPC_PORT:-4317}:4317"
      - "${LAB28_OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      - jaeger

  pushgateway:
    image: prom/pushgateway:v1.11.3
    ports:
      - "${LAB28_PUSHGATEWAY_PORT:-9091}:9091"

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${LAB28_PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - gateway
      - kafka-exporter
      - qdrant
      - feast
      - mlflow
      - otel-collector
      - pushgateway

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${LAB28_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  airflow-data:
  grafana-data:
  mlflow-data:
  prometheus-data:
  qdrant-data:
  spark-ivy:
